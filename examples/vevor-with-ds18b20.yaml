esphome:
  name: esp32-i2c-sniffer-vevor
  friendly_name: ESP32 Sniffer VEVOR
  comment: "I2C Sniffer v1.0.0 + optional DS18B20 ROM scanner"

# Classic ESP32-WROOM-32/32U (not ESP32-C3)
esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components:
      - i2c_sniffer

logger:
  level: INFO
  logs:
    i2c_sniffer: INFO

api:

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

# Example of sniffing a VEVOR weather station (3.3 V I2C verified on tested unit).
# No sensor required to observe address probes; NACK is normal if absent.
# Do not add an ESPHome i2c: bus on the same GPIOs.
# Do not assume other VEVOR revisions use 3.3 V.
i2c_sniffer:
  id: vevor_i2c_sniffer
  raw_edges: true  # set false to reduce logs
  quiet_time_ms: 200
  scl_pin:
    number: GPIO4
    mode:
      input: true
      pullup: true
      pulldown: false
  sda_pin:
    number: GPIO5
    mode:
      input: true
      pullup: true
      pulldown: false

# Magistrala niezalezna od I2C: DS18B20, GPIO27 + 4.7k do 3.3 V
one_wire:
  - platform: gpio
    id: ds18b20_bus
    pin: GPIO27

binary_sensor:
  - platform: status
    name: "ESP32 Sniffer Status"
    entity_category: diagnostic

sensor:
  - platform: wifi_signal
    name: "ESP32 Sniffer WiFi RSSI"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "ESP32 Sniffer Uptime"
    entity_category: diagnostic

  - platform: template
    name: "DS18B20 Liczba urządzeń"
    id: ds18b20_count
    accuracy_decimals: 0
    icon: mdi:counter
    update_interval: never

text_sensor:
  - platform: template
    name: "DS18B20 Ostatni ROM"
    id: ds18b20_last_rom
    icon: mdi:identifier
    update_interval: never

  - platform: template
    name: "DS18B20 Status skanowania"
    id: ds18b20_scan_status
    icon: mdi:magnify-scan
    update_interval: never

button:
  - platform: template
    name: "DS18B20 Skanuj ROM"
    id: ds18b20_scan_button
    icon: mdi:magnify
    on_press:
      - lambda: |-
          id(ds18b20_bus).search();
          const auto &devices = id(ds18b20_bus).get_devices();
          id(ds18b20_count).publish_state(devices.size());

          if (devices.empty()) {
            id(ds18b20_scan_status).publish_state("Brak urządzenia 1-Wire");
            ESP_LOGW("ds18b20", "Nie znaleziono urządzenia");
            return;
          }

          if (devices.size() != 1) {
            id(ds18b20_scan_status).publish_state("Podłącz tylko 1 czujnik");
            ESP_LOGW("ds18b20", "Wykryto %u urządzeń", (unsigned) devices.size());
            return;
          }

          const uint64_t rom = devices[0];
          if ((rom & 0xFF) != 0x28) {
            id(ds18b20_scan_status).publish_state("To nie jest DS18B20 (rodzina != 28)");
            return;
          }

          char rom_hex[19];
          snprintf(rom_hex, sizeof(rom_hex), "0x%016llX", (unsigned long long) rom);
          id(ds18b20_last_rom).publish_state(rom_hex);
          id(ds18b20_scan_status).publish_state("Odczyt poprawny");
          ESP_LOGI("ds18b20", "Wykryto DS18B20, ROM: %s", rom_hex);

  - platform: restart
    name: "ESP32 Sniffer Restart"
    entity_category: diagnostic