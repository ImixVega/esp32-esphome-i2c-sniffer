# ESP32 I2C Sniffer v1.0.0 - public sample configuration
# Tested on ESP32-WROOM-32U with ESPHome / ESP-IDF.
# Set credentials in local secrets.yaml (never commit that file).
esphome:
  name: esp32-i2c-sniffer
  friendly_name: ESP32 I2C Sniffer
  comment: "Passive GPIO I2C capture v1.0.0"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components:
      - i2c_sniffer

logger:
  level: INFO
  logs:
    i2c_sniffer: INFO

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Optional web status page; exposes logs/diagnostics on the local network.
# Enable only on a trusted LAN if needed.
# web_server:
#   port: 80

# PASSIVE ONLY: do NOT configure an ESPHome `i2c:` bus on these GPIOs.
# Connect ESP32 GND to target GND, SCL to SCL, SDA to SDA.
# Use ONLY 3.3 V-compatible GPIO signals (ESP32 is NOT 5 V tolerant).
# With existing target pull-ups you may disable the internal ones.
i2c_sniffer:
  id: passive_i2c
  scl_pin:
    number: GPIO4
    mode:
      input: true
      pullup: true
      pulldown: false
  sda_pin:
    number: GPIO5
    mode:
      input: true
      pullup: true
      pulldown: false
  raw_edges: true
  quiet_time_ms: 200

binary_sensor:
  - platform: status
    name: "Sniffer Status"
    entity_category: diagnostic

sensor:
  - platform: uptime
    name: "Sniffer Uptime"
    entity_category: diagnostic